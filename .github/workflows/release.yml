name: Publish Horizon Warp release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install ACME cross-assembler
        run: |
          sudo apt-get update
          sudo apt-get install --yes acme
      - name: Build and verify release assets
        run: bash tools/verify_release.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --generate-notes \
            build/c64-horizon-warp.prg \
            SHA256SUMS \
            LICENSE NOTICE README.md \
            docs/architecture.md docs/variant-audit.md \
            assets/c64-horizon-warp-effects.png
